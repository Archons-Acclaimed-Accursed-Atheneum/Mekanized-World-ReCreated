# ReTerraForged Performance Config
# Delete this file before exporting a modpack so each machine can generate suitable defaults.
#
# tileSize: terrain pre-generation tile size (1-8), default 3
# batchCount: parallel batches per tile axis (1-20)
# threadCount: terrain generation worker threads (1-64)
# Default threadCount keeps two CPU cores free for the main/render threads.
#
tileSize=3
batchCount=6
threadCount=30
